<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="wrapper">
        <header>
            <a href="index.html">
                <img class="logo" src="assets/Logo_hbnb.png" alt="logo"/>
            </a>
        </header>
        <main>
            <form id="signup-form">
                <h2>Signup</h2>
                <div class="form">
                    <label for="first_name">First Name:</label>
                    <input type="" id="first-name" name="first-name" required>

                    <label for="last_name">Last Name:</label>
                    <input type="" id="last-name" name="last-name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="signup-email" name="email" required>

                    <label for="password">Password:</label>
                    <input type="password" id="signup-password" name="password" required>
                </div>
                <div id="error-message"></div>
                <button type="submit" class="btn-submit" id="signup-button" >Signup</button>
            </form>
            <form id="login-form">
                <h2>Login</h2>
                <div class="form">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div id="error-message"></div>
                <button type="submit" class="btn-submit" id="login-button" disabled>Login</button>
            </form>
        </main>
        <footer>
            <img src="assets/dodo_logo.jpg" class="logo-footer">
            © 2024 HBnB Evolution All rights reserved
        </footer>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
